<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Student Form</h1>

        <p class="date">
            Student Information
        </p>

        <form action="/submit" method="POST">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="age">Age</label>

            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter your age"
                min="1"
                required
            >

            <label for="city">City</label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >

            <button type="submit">
                Submit
            </button>

        </form>

        <a class="data-link" href="/data">
            View Submitted Data →
        </a>

    </div>

</body>

</html>
