<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submitted Data</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            color: #1f2937;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 30px;
            color: #111827;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* LEFT SIDE */

        .records {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .records h2,
        .json-section h2 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #111827;
        }

        .record {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .record:last-child {
            margin-bottom: 0;
        }

        .field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .field:last-child {
            border-bottom: none;
        }

        .field-name {
            font-weight: 600;
            color: #4b5563;
        }

        .field-value {
            color: #111827;
        }


        /* RIGHT SIDE */

        .json-section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .json-box {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            min-height: 300px;
            max-height: 500px;
        }

        pre {
            margin: 0;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .copy-button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .copy-button:hover {
            background: #4338ca;
        }

        .copy-button:active {
            transform: scale(0.98);
        }


        /* BOTTOM LINK */

        .back-link {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            body {
                padding: 20px;
            }

            .content {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Submitted Data</h1>

        <div class="content">

            <!-- LEFT SIDE -->

            <div class="records">

                <h2>Student Records</h2>

                {% for document in data %}

                    <div class="record">

                        <div class="field">
                            <span class="field-name">Name</span>
                            <span class="field-value">
                                {{ document.name }}
                            </span>
                        </div>

                        <div class="field">
                            <span class="field-name">Age</span>
                            <span class="field-value">
                                {{ document.age }}
                            </span>
                        </div>

                        <div class="field">
                            <span class="field-name">City</span>
                            <span class="field-value">
                                {{ document.city }}
                            </span>
                        </div>

                    </div>

                {% endfor %}

            </div>


            <!-- RIGHT SIDE -->

            <div class="json-section">

                <h2>JSON Response</h2>

                <div class="json-box">

                    <pre id="jsonData">{{ data | tojson(indent=4) }}</pre>

                </div>

                <button class="copy-button" onclick="copyJSON()">
                    Copy JSON
                </button>

            </div>

        </div>


        <a class="back-link" href="/">
            ← Back to Form
        </a>

    </div>


    <script>

        function copyJSON() {

            const json = document.getElementById("jsonData").innerText;

            navigator.clipboard.writeText(json);

            const button = document.querySelector(".copy-button");

            button.innerText = "Copied!";

            setTimeout(() => {
                button.innerText = "Copy JSON";
            }, 1500);
        }

    </script>

</body>

</html>
